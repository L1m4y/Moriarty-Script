name: shellcheck

on:
  push:
    branches: [main, audit-fixes]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Static analysis
        run: shellcheck -S warning moriarty.sh moriarty-restore.sh
      - name: Syntax check
        run: |
          bash -n moriarty.sh
          bash -n moriarty-restore.sh
      - name: Dry run
        run: bash moriarty.sh --dry-run --yes --no-color
